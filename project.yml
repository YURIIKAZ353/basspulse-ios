name: BassPulse
options:
  bundleIdPrefix: dev.basspulse
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
targets:
  BassPulse:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.basspulse.prototype
        PRODUCT_NAME: BassPulse
        MARKETING_VERSION: "0.1.13"
        CURRENT_PROJECT_VERSION: "14"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/BassPulse-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
    scheme:
      gatherCoverageData: false
