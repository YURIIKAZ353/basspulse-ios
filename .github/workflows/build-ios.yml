name: Build BassPulse IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: basspulse-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test actual frequency detector
        run: |
          mkdir -p build
          swiftc Sources/DSP.swift Tests/main.swift -o build/dsp-tests
          build/dsp-tests
      - name: Install project generator
        run: brew install xcodegen
      - name: Test runtime diagnostics
        run: |
          swiftc Sources/RuntimeDiagnostics.swift Tests/Diagnostics/main.swift -o build/diagnostics-tests
          build/diagnostics-tests
      - name: Test PCM importer with real WAV and AAC
        run: |
          swiftc Sources/PCMImporter.swift Sources/ImportedAudioStore.swift Sources/PrototypeError.swift Tests/Audio/main.swift -o build/import-tests-bin
          build/import-tests-bin
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Test actual music chunk preparation
        run: |
          swiftc Sources/DSP.swift Sources/AudioChunkReader.swift Sources/PrototypeError.swift Tests/Chunks/main.swift -o build/chunk-tests
          build/chunk-tests
      - name: Build for physical iPhone without signing
        run: |
          set -o pipefail
          xcodebuild -project BassPulse.xcodeproj -scheme BassPulse \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build/xcodebuild.log
      - name: Package IPA for AltStore signing
        run: |
          mkdir -p build/package/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/BassPulse.app build/package/Payload/
          cd build/package
          /usr/bin/zip -qry ../BassPulse-unsigned.ipa Payload
      - name: Downloadable IPA
        uses: actions/upload-artifact@v4
        with:
          name: BassPulse-IPA
          path: build/BassPulse-unsigned.ipa
          retention-days: 14
          if-no-files-found: error
      - name: Build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BassPulse-build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
